name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    steps:
      - uses: actions/checkout@v4

      - name: Derive the interpreter cache key from the Makefile pin
        run: |
          SHA="$(sed -n 's/^LUA_SHA256[[:space:]]*:= //p' Makefile)"
          echo "LUA_CACHE_KEY=dist-$SHA" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.LUA_CACHE_KEY }}

      - name: Fetch and build the pinned interpreter
        run: make dist-lua

      - name: Set up Go for fuzzing
        if: hashFiles('fuzz/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: fuzz/go.mod

      - name: Fuzz
        if: hashFiles('fuzz/go.mod') != ''
        run: make fuzz

      - name: Run the test suite
        run: make test

      - name: Check the workflow (pins and fork guard)
        run: make check-ci

  corpus:
    name: STANDARD.md, IMPLEMENTING.md, conformance/ and conformance-controls/ match mas-bandwidth/serialize
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    env:
      SERIALIZE_TAG: v2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Check out mas-bandwidth/serialize at the pinned tag
        run: rm -rf "$RUNNER_TEMP/serialize" && git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git "$RUNNER_TEMP/serialize"

      - name: conformance/ matches the pinned release
        run: diff -ru "$RUNNER_TEMP/serialize"/conformance conformance

      - name: conformance-controls/ matches the pinned release
        run: diff -ru "$RUNNER_TEMP/serialize"/conformance-controls conformance-controls

      - name: STANDARD.md and IMPLEMENTING.md match the pinned release
        run: |
          diff -u "$RUNNER_TEMP/serialize"/STANDARD.md STANDARD.md
          diff -u "$RUNNER_TEMP/serialize"/IMPLEMENTING.md IMPLEMENTING.md
