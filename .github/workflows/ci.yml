name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    steps:
      - uses: actions/checkout@v4

      - name: Derive the interpreter cache key from the Makefile pin
        run: |
          SHA="$(sed -n 's/^LUA_SHA256[[:space:]]*:= //p' Makefile)"
          echo "LUA_CACHE_KEY=dist-$SHA" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.LUA_CACHE_KEY }}

      - name: Fetch and build the pinned interpreter
        run: make dist-lua

      - name: Fetch and build the pinned linter (luacheck)
        run: make dist-luacheck

      - name: Lint (luacheck, zero warnings)
        run: make lint

      - name: Lint negative control (a planted unused variable and global must be refused)
        run: make lint-neg

      - name: Set up Go for fuzzing
        if: hashFiles('fuzz/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: fuzz/go.mod

      - name: Fuzz
        if: hashFiles('fuzz/go.mod') != ''
        run: make fuzz

      - name: Run the test suite
        run: make test

      - name: Check the workflow (pins and fork guard)
        run: make check-ci

  corpus:
    name: STANDARD.md, IMPLEMENTING.md, conformance/ and conformance-controls/ match mas-bandwidth/serialize
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    env:
      SERIALIZE_REF: 3617d3606db9c5686018d6568f0aa761869083c5
    steps:
      - uses: actions/checkout@v4

      - name: Check out mas-bandwidth/serialize at the pinned commit
        run: |
          rm -rf "$RUNNER_TEMP/serialize"
          git init --quiet "$RUNNER_TEMP/serialize"
          git -C "$RUNNER_TEMP/serialize" fetch --quiet --depth 1 https://github.com/mas-bandwidth/serialize.git "$SERIALIZE_REF"
          git -c advice.detachedHead=false -C "$RUNNER_TEMP/serialize" checkout --quiet FETCH_HEAD

      - name: conformance/ matches the pinned commit
        run: diff -ru "$RUNNER_TEMP/serialize"/conformance conformance

      - name: conformance-controls/ matches the pinned commit
        run: diff -ru "$RUNNER_TEMP/serialize"/conformance-controls conformance-controls

      - name: STANDARD.md and IMPLEMENTING.md match the pinned commit
        run: |
          diff -u "$RUNNER_TEMP/serialize"/STANDARD.md STANDARD.md
          diff -u "$RUNNER_TEMP/serialize"/IMPLEMENTING.md IMPLEMENTING.md
